name: couponzguru

services:
  strapi:
    image: ${APP_IMAGE:?APP_IMAGE is required}:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    user: "1001:1001"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_POOL_MIN: "0"
      DATABASE_POOL_MAX: "5"
      # Exactly one admin process owns ISR delivery. The render sibling below is
      # read-heavy only and explicitly disables both paid translation work and
      # ISR delivery.
      ISR_OUTBOX_DISPATCHER_ENABLED: "true"
      TRANSLATION_OUTBOX_DISPATCHER_ENABLED: "false"
      TRANSLATION_BACKFILL_RUNNER_ENABLED: "false"
      # Database backups are mandatory on every host and run on exactly one
      # process: strapi-maintenance when it is deployed, otherwise here.
      # deploy.sh exports ADMIN_BACKUP_RUNNER_ENABLED from
      # MAINTENANCE_SERVICE_ENABLED; set the same value in the env file if you
      # run Compose by hand with the maintenance service disabled.
      BACKUP_RUNNER_ENABLED: ${ADMIN_BACKUP_RUNNER_ENABLED:-false}
    ports:
      # Always publish on loopback so host-local consumers (admin nginx, an
      # SSH tunnel, the deploy health check) keep working.
      - "127.0.0.1:${APP_PORT:-1337}:1337"
      # AND publish on the DO VPC private IP so the Astro origin (ISR warm /
      # revalidate) can reach Strapi over the VPC. APP_BIND is REQUIRED and
      # must be the private IP (e.g. 10.139.0.6) — the `:?` guard fails the
      # deploy loudly if it is unset rather than letting an empty value expand
      # to 0.0.0.0. NEVER use 0.0.0.0: Docker's published ports bypass ufw, so
      # that exposes the Strapi admin/API publicly. Also restrict :1337 to the
      # Astro droplet's private IP via the DO Cloud Firewall.
      - "${APP_BIND:?APP_BIND must be set to the VPC private IP in ${ENV_FILE:-.env.production} (never 0.0.0.0)}:${APP_PORT:-1337}:1337"
    # Optional: mount CA for DB SSL (set DATABASE_SSL_CA_PATH=/opt/app/certs/ca.crt)
    # volumes:
    #   - ./certs/ca-certificate.crt:/opt/app/certs/ca.crt:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1337/_health').then((r)=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Second Strapi process so the droplet's second core is used. This container
  # serves ONLY render-time API traffic (the Astro SSR origin points its
  # STRAPI_URL at :1338); the `strapi` service above keeps the admin panel,
  # cron scheduler, and the gateway's search/redeem/rating traffic on :1337.
  # Publish storms then saturate this container while the admin one stays
  # responsive.
  #
  # Pool sizes are pinned per service in each `environment:` block below
  # (5 admin + 5 render + 4 maintenance = 14; Compose `environment` wins over
  # the shared env_file, so DATABASE_POOL_MAX in ${ENV_FILE} is NOT what
  # production uses). A running pg_dump on the maintenance service adds one
  # connection outside its pool. deploy.sh checks the total against
  # DATABASE_CONNECTION_BUDGET (default 22, the managed-DB backend limit) and
  # keeps the remainder as rollout headroom.
  strapi-render:
    image: ${APP_IMAGE:?APP_IMAGE is required}:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    user: "1001:1001"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_POOL_MIN: "0"
      DATABASE_POOL_MAX: "5"
      # The */5 scheduler writes to the DB and must run exactly once — in the
      # admin container. Never enable cron here.
      CRON_ENABLED: "false"
      # The durable outbox is shared through Postgres, but delivery is process
      # work. Keep exactly one dispatcher on the admin service so render-time
      # traffic cannot amplify retries into overlapping route-inventory scans.
      ISR_OUTBOX_DISPATCHER_ENABLED: "false"
      # Translation jobs are also a shared-Postgres queue. One maintenance-owned
      # dispatcher keeps provider concurrency and daily-spend controls global
      # instead of multiplying them by the number of Strapi processes.
      TRANSLATION_OUTBOX_DISPATCHER_ENABLED: "false"
      TRANSLATION_BACKFILL_RUNNER_ENABLED: "false"
      BACKUP_RUNNER_ENABLED: "false"
      # Every socket that can reach this container is internal by construction
      # (ports are published on loopback and the VPC private IP, firewalled),
      # so trust private sources without per-host IP allowlisting. On a
      # single-server deployment the Astro origin's requests hairpin through
      # Docker NAT and arrive as a bridge-gateway address that differs per
      # host — an exact RATE_LIMIT_TRUSTED_IPS entry cannot express that.
      # NEVER set this on the admin service above: proxied visitor traffic
      # reaches it from the same private gateway and would bypass the limiter.
      RATE_LIMIT_TRUST_PRIVATE_SOCKETS: "true"
    ports:
      - "127.0.0.1:${RENDER_PORT:-1338}:1337"
      # Same rule as the admin container: APP_BIND must be the VPC private IP,
      # never 0.0.0.0 (published ports bypass ufw). Restrict ${RENDER_PORT} to
      # the Astro droplet's private IP via the DO Cloud Firewall.
      - "${APP_BIND:?APP_BIND must be set to the VPC private IP in ${ENV_FILE:-.env.production} (never 0.0.0.0)}:${RENDER_PORT:-1338}:1337"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1337/_health').then((r)=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Durable catalogue scans run here, away from the admin and render request
  # loops. The strict CPU/pool limits protect a two-core host and the managed
  # database; the scanner's persisted cursor makes the slower pace safe.
  strapi-maintenance:
    profiles: [translation]
    image: ${APP_IMAGE:?APP_IMAGE is required}:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    user: "1001:1001"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      CRON_ENABLED: "false"
      ISR_OUTBOX_DISPATCHER_ENABLED: "false"
      TRANSLATION_OUTBOX_DISPATCHER_ENABLED: "true"
      TRANSLATION_BACKFILL_RUNNER_ENABLED: "true"
      # Exactly one process takes database backups (pg_dump streamed to S3).
      # It adds ONE Postgres connection outside the pool while a dump runs
      # (maintenance total 5, still inside the 22-connection budget) and is
      # stopped first by deploy.sh so a running dump never blocks migrations.
      BACKUP_RUNNER_ENABLED: "true"
      DATABASE_POOL_MIN: "0"
      DATABASE_POOL_MAX: "4"
      TRANSLATION_OUTBOX_BATCH_SIZE: "2"
      TRANSLATION_CONCURRENCY: "2"
      TRANSLATION_BACKFILL_MAX_DOCS_PER_SECOND: "5"
    cpus: "0.50"
    # 768m: Strapi RSS + pg_dump (~30 MB) + two 8 MiB S3 upload buffers.
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1337/_health').then((r)=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
