# Upstream pool for Strapi replicas
upstream strapi_backend {
    least_conn;

    server 127.0.0.1:1337 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:1338 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:1339 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name portal.couponzguru.com;

    return 301 https://portal.couponzguru.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;

    server_name portal.couponzguru.com;

    ssl_certificate /etc/letsencrypt/live/portal.couponzguru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.couponzguru.com/privkey.pem;

    access_log /home/vira2404/portal.couponzguru.com/logs/access.log;
    error_log /home/vira2404/portal.couponzguru.com/logs/error.log;

    # Strapi uploads are capped at 25 MB (formidable, config/middlewares.ts);
    # reject oversized bodies at the edge instead of buffering 64 MB first.
    client_max_body_size 26m;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # Strapi's own security middleware (strapi::security) already sends CSP,
    # X-Frame-Options, X-Content-Type-Options, and Referrer-Policy on every
    # proxied response — do NOT re-add them here: a second CSP would intersect
    # with Strapi's and break the admin media library. nginx only adds what
    # Strapi doesn't cover on its own generated responses (403s, errors).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Public visitors should never call CMS content APIs directly. The public
    # website calls beta.couponzguru.com, then the ISR gateway reaches Strapi
    # over private networking. Keep the admin UI public, but close the public
    # content/redeem API surface on portal.couponzguru.com.
    location ^~ /api/ {
        return 403;
    }

    location ^~ /unique-coupon/ {
        return 403;
    }

    location / {
        proxy_pass http://strapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        # Reserved request-only ISR credential. Public clients must never be
        # able to pass it through the loopback proxy into Strapi.
        proxy_set_header X-CGuru-ISR-Cache-Bypass "";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_pass_request_headers on;
    }
}