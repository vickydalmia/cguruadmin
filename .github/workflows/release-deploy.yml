name: Build and Push
run-name: CMS image · ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable CMS image tag, for example v1.1.5"
        required: true
        type: string
      git_ref:
        description: "Reviewed branch, tag, or commit to build"
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push production image · ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cguru_test
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}

      - name: Validate manual image tag
        if: github.event_name == 'workflow_dispatch'
        env:
          CMS_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ ! "$CMS_IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: use letters, numbers, dot, underscore, or hyphen." >&2
            exit 1
          fi

      - id: source
        name: Resolve source commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify unique-code integrity on PostgreSQL
        run: yarn test:postgres
        env:
          UNIQUE_CODE_TEST_DATABASE_URL: postgres://postgres:test-password@127.0.0.1:5432/cguru_test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=long,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=raw,value=sha-${{ steps.source.outputs.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Build and push image · ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
